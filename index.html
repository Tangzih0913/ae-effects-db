<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE 特效資料庫 · 搜尋</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1e2130; --text:#e8eaf0; --muted:#9aa0b4;
    --accent:#6ea8fe; --accent2:#f0a; --border:#2a2e3f; --chip:#232735;
    --plugin-bg:#101f2b; --plugin-border:#2b5d82; --plugin-label:#83c8ff;
    --script-bg:#24182d; --script-border:#704789; --script-label:#dda4ff;
    --builtin-bg:#15251d; --builtin-border:#397356; --builtin-label:#82dca9;
    --recipe-bg:#292115; --recipe-border:#80652e; --recipe-label:#f0c66e;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7fb; --panel:#fff; --panel2:#f0f2f8; --text:#1a1d29; --muted:#666e85;
           --accent:#2563eb; --accent2:#c026a8; --border:#e2e5ee; --chip:#eef1f8;
           --plugin-bg:#edf7ff; --plugin-border:#9bc9ee; --plugin-label:#17649d;
           --script-bg:#f8effd; --script-border:#d1abe5; --script-label:#7d3d9d;
           --builtin-bg:#eef9f2; --builtin-border:#a7d7b7; --builtin-label:#267349;
           --recipe-bg:#fff8e8; --recipe-border:#dfc682; --recipe-label:#8a6815;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 18px}
  h1{margin:0 0 2px;font-size:18px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12.5px}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}
  .searchbox{position:relative;margin-top:12px}
  #q{width:100%;padding:13px 44px 13px 15px;font-size:16px;border-radius:12px;border:1px solid var(--border);
     background:var(--panel);color:var(--text);outline:none}
  #q:focus{border-color:var(--accent)}
  #clearQ{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;
    border-radius:9px;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
  #clearQ:hover{color:var(--text);background:var(--panel2)}
  #clearQ[hidden]{display:none}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .filters select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:13px}
  .filters button{background:var(--panel);color:var(--accent);border:1px solid var(--border);border-radius:9px;
    padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .filters button:hover{border-color:var(--accent)}
  .aimsg{margin-top:8px;font-size:12.5px;color:var(--accent);min-height:1em}
  .aimsg:empty{display:none;margin-top:0;min-height:0}
  .aimsg a{color:var(--accent)}
  .dd{position:relative;display:inline-block}
  .aibtn{margin-left:auto}
  .catpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:30;
    width:max-content;max-width:min(560px,88vw);
    padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    display:flex;flex-wrap:wrap;gap:6px;max-height:min(300px,50vh);overflow-y:auto}
  .catpanel[hidden]{display:none}   /* 必要：class 的 display:flex 會蓋過 [hidden] 的 display:none */
  .actbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .actbar:empty{display:none;margin-top:0}
  .actbar .a{font:inherit;font-size:12px;background:var(--accent);color:#fff;border:0;border-radius:20px;padding:3px 9px;
    cursor:pointer;user-select:none}
  .actbar .a .x{margin-left:6px;opacity:.85}
  .actbar .allclr{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:1px dashed var(--border);
    border-radius:20px;padding:3px 9px;cursor:pointer}
  .catpanel .c{font-size:12.5px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    border-radius:20px;padding:4px 11px;cursor:pointer;user-select:none;white-space:nowrap}
  .catpanel .c:hover{border-color:var(--accent)}
  .catpanel .c.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .catpanel .c .n{color:var(--muted);font-size:11px;margin-left:5px}
  .catpanel .c.on .n{color:rgba(255,255,255,.8)}
  .catpanel .clr{color:var(--accent);border-style:dashed}
  .filters button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .favfilter{white-space:nowrap}
  .favfilter .n{margin-left:4px;font-size:11px;opacity:.8}
  button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .hint b{color:var(--accent);cursor:pointer;font-weight:600}
  #count{color:var(--muted);font-size:12.5px;margin:14px 0 4px}
  .summary{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:7px}
  .summary i{font-style:normal;border:1px solid var(--border);border-radius:20px;padding:1px 7px}
  .card{background:var(--panel);border:1px solid var(--border);border-left-width:4px;border-radius:12px;padding:13px 15px;margin:9px 0}
  .card.kind-plugin{background:var(--plugin-bg);border-color:var(--plugin-border)}
  .card.kind-script{background:var(--script-bg);border-color:var(--script-border)}
  .card.kind-builtin{background:var(--builtin-bg);border-color:var(--builtin-border)}
  .card.kind-recipe{background:var(--recipe-bg);border-color:var(--recipe-border)}
  .card .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:650}
  .kindbadge,.catbadge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid transparent}
  .kindbadge{font-weight:700}
  .kindbadge.kind-plugin{color:var(--plugin-label);border-color:var(--plugin-border);background:color-mix(in srgb,var(--plugin-bg) 65%,transparent)}
  .kindbadge.kind-script{color:var(--script-label);border-color:var(--script-border);background:color-mix(in srgb,var(--script-bg) 65%,transparent)}
  .kindbadge.kind-builtin{color:var(--builtin-label);border-color:var(--builtin-border);background:color-mix(in srgb,var(--builtin-bg) 65%,transparent)}
  .kindbadge.kind-recipe{color:var(--recipe-label);border-color:var(--recipe-border);background:color-mix(in srgb,var(--recipe-bg) 65%,transparent)}
  .catbadge{color:var(--muted);background:var(--chip);border-color:var(--border)}
  .kindlegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;color:var(--muted);font-size:11.5px}
  .kindlegend span{display:inline-flex;align-items:center;gap:5px}
  .kindlegend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .kindlegend .plugin{background:var(--plugin-label)} .kindlegend .script{background:var(--script-label)}
  .kindlegend .builtin{background:var(--builtin-label)} .kindlegend .recipe{background:var(--recipe-label)}
  .warn{font-size:11px;color:#e0a020;background:rgba(224,160,32,.13);padding:2px 8px;border-radius:20px}
  a.namelink{color:var(--text);text-decoration:none}
  a.namelink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .ext{font-size:11px;color:var(--muted);margin-left:5px;vertical-align:2px}
  a.namelink:hover .ext{color:var(--accent)}
  .src{font-size:11px;color:var(--muted);margin-left:auto}
  .favbtn{align-self:center;width:28px;height:28px;margin:-4px -4px -4px 0;padding:0;border:1px solid transparent;
    border-radius:8px;background:transparent;color:var(--muted);font:18px/1 inherit;cursor:pointer}
  .favbtn:hover{color:#f3c64e;background:var(--chip);border-color:var(--border)}
  .favbtn.on{color:#f3c64e}
  .desc{color:var(--text);margin-top:6px;font-size:14px}
  .stack{margin-top:8px;padding-left:2px}
  .stack li{font-size:13px;color:var(--muted);margin:2px 0}
  .variants{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .variants span{font-size:11.5px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:2px 7px;color:var(--muted)}
  .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .tags button{font:inherit;font-size:11px;color:var(--muted);background:var(--chip);border:0;border-radius:6px;padding:1px 7px;cursor:pointer}
  .tags button:hover{color:var(--accent)}
  mark{background:transparent;color:var(--accent2);font-weight:700}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 0 40px}
  footer a{color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .more{display:block;margin:18px auto 4px;padding:9px 18px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--accent);font:inherit;cursor:pointer}
  .more:hover{border-color:var(--accent)}
  @media (max-width:640px){
    header{position:static;padding:12px 0}
    .wrap{padding:0 12px}
    .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .filters .dd,.filters .dd>button,.filters select,.filters .favfilter{width:100%}
    .aibtn{grid-column:1/-1;margin-left:0}
    .catpanel{max-width:calc(100vw - 24px)}
    .kindlegend{gap:5px 9px}
    .card{padding:12px;margin:8px 0}
    .src{width:100%;margin-left:0}
    .summary{display:flex;margin:5px 0 0}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🎬 AE 特效資料庫</h1>
    <div class="sub">描述想要的畫面，從 AE 外掛、腳本、內建效果與效果配方中找工具</div>
    <div class="searchbox">
      <input id="q" placeholder="輸入描述… 例：發光、故障、老電影、甩鏡轉場、粒子、去背、慢動作" autofocus autocomplete="off" aria-label="搜尋 AE 特效">
      <button id="clearQ" type="button" title="清除搜尋" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="filters">
      <span class="dd">
        <button id="catBtn" type="button" title="可複選分類" aria-expanded="false">分類 ▾</button>
        <div id="catPanel" class="catpanel" hidden></div>
      </span>
      <span class="dd">
        <button id="srcBtn" type="button" title="可複選來源" aria-expanded="false">來源 ▾</button>
        <div id="srcPanel" class="catpanel" hidden></div>
      </span>
      <span class="dd">
        <button id="kindBtn" type="button" title="可複選工具型態" aria-expanded="false">型態 ▾</button>
        <div id="kindPanel" class="catpanel" hidden></div>
      </span>
      <select id="sort" title="排序方式">
        <option value="popular" selected>排序：精選熱門</option>
        <option value="relevance">排序：搜尋相關度</option>
        <option value="name">排序：名稱 A–Z</option>
        <option value="category">排序：分類</option>
        <option value="source">排序：來源</option>
      </select>
      <button id="favBtn" class="favfilter" type="button" aria-pressed="false" title="收藏只儲存在這台裝置的瀏覽器">☆ 只看收藏<span class="n">0</span></button>
      <button id="aiBtn" class="aibtn" type="button" title="複製一段提示詞，貼進 ChatGPT/Claude 就能用「貼圖」找特效">🤖 用 AI 找 / 貼圖找</button>
    </div>
    <div id="activeFilters" class="actbar"></div>
    <div id="aiMsg" class="aimsg"></div>
    <div class="kindlegend" aria-label="工具型態顏色圖例">
      <span><i class="plugin"></i>外掛／效果</span><span><i class="script"></i>腳本／面板</span>
      <span><i class="builtin"></i>AE 內建</span><span><i class="recipe"></i>效果配方</span>
    </div>
    <div class="hint">試試：
      <b data-q="霓虹">霓虹</b> ·
      <b data-q="老電影">老電影</b> ·
      <b data-q="故障">故障</b> ·
      <b data-q="甩鏡">甩鏡</b> ·
      <b data-q="去背">去背</b> ·
      <b data-q="慢動作">慢動作</b> ·
      <b data-q="魔法">魔法</b> ·
      <b data-q="調色">調色</b>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="count" aria-live="polite"></div>
  <div id="results"></div>
</div>
<footer>
  <div>共 <span id="total">…</span> 筆 · 點名稱開官方頁 · 搭配 Codex / Claude Code 的 <code>/find-effect</code> 可「貼圖」搜尋</div>
  <div style="margin-top:10px">
    找不到某個外掛？歡迎補充 →
    <a href="https://github.com/xup61069/ae-effects-db/issues/new?template=add-effect.yml" target="_blank" rel="noopener">回報缺少的特效</a> ·
    <a href="https://github.com/xup61069/ae-effects-db/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">如何貢獻</a> ·
    <a href="https://github.com/xup61069/ae-effects-db" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<script>
const FILES = ["red-giant","universe","sapphire","continuum","builtin-ae","aescripts","third-party","installed","recipes"];
const SRC_LABEL = {"red-giant":"Red Giant","universe":"Universe","sapphire":"Sapphire",
  "continuum":"Continuum","builtin-ae":"AE 內建","aescripts":"aescripts","third-party":"第三方",
  "installed":"本機補充","recipes":"配方"};
const KIND_LABEL = {plugin:"外掛／效果",script:"腳本／面板",builtin:"AE 內建",recipe:"效果配方"};
const CAT_LABEL = {
  glow:"發光", "blur-glow":"模糊／發光", light:"光線", flare:"鏡頭光暈", particles:"粒子",
  stylize:"風格化", film:"底片／復古", color:"調色", blur:"模糊", warp:"扭曲",
  keying:"去背／鍵控", tracking:"追蹤", restore:"修復", time:"時間", transition:"轉場",
  text:"文字", generate:"生成", "3d":"3D", draw:"繪圖", paint:"繪畫", art:"藝術化",
  texture:"材質", audio:"音訊", physics:"物理", rigging:"綁定", workflow:"工作流程",
  render:"算圖／輸出", expression:"表達式", animation:"動畫", preset:"預設管理",
  utility:"工具", distort:"變形", mograph:"動態設計", beauty:"美顏", edge:"邊緣",
  emboss:"浮雕", composite:"合成", matte:"遮罩", perspective:"透視", kaleido:"萬花筒",
  vr:"VR／360", recipe:"效果配方"
};
let DATA = [];
let LOAD_ERRORS = [];
let visibleLimit = 60;
let favoritesOnly = false;
const FAVORITES_KEY = "ae-effects-db:favorites:v1";
const FAVORITES = loadFavorites();

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function itemKey(d){return `${d._src}:${d.name}`;}
function loadFavorites(){
  try{
    const saved=JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]");
    return new Set(Array.isArray(saved)?saved:[]);
  }catch(e){return new Set();}
}
function saveFavorites(){
  try{localStorage.setItem(FAVORITES_KEY,JSON.stringify([...FAVORITES]));}catch(e){}
  syncFavoriteButton();
}
function syncFavoriteButton(){
  const btn=document.getElementById("favBtn");
  if(!btn)return;
  btn.classList.toggle("active",favoritesOnly);
  btn.setAttribute("aria-pressed",String(favoritesOnly));
  btn.firstChild.textContent=favoritesOnly?"★ 只看收藏":"☆ 只看收藏";
  btn.querySelector(".n").textContent=FAVORITES.size;
}

async function boot(){
  LOAD_ERRORS = [];
  const all = await Promise.all(FILES.map(async f=>{
    try{
      const response = await fetch("data/"+f+".jsonl");
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const t = await response.text();
      return t.split("\n").filter(l=>l.trim()).map((l,i)=>{
        try{const o=JSON.parse(l);o._src=f;o._rank=i;return o;}catch(e){return null;}
      }).filter(Boolean);
    }catch(e){LOAD_ERRORS.push(`${f}: ${e.message}`);return [];}
  }));
  DATA = all.flat();
  const availableKeys=new Set(DATA.map(itemKey));
  let favoritesChanged=false;
  for(const key of FAVORITES){if(!availableKeys.has(key)){FAVORITES.delete(key);favoritesChanged=true;}}
  if(favoritesChanged)saveFavorites();
  document.getElementById("total").textContent = DATA.length;
  // build filters
  catFilter.build(); srcFilter.build(); kindFilter.build();
  restoreState();
  if(LOAD_ERRORS.length){
    document.getElementById("aiMsg").textContent=`⚠ 有 ${LOAD_ERRORS.length} 個資料檔載入失敗：${LOAD_ERRORS.join("、")}`;
  }
  render();
}

// ── 多選篩選器（分類 / 來源共用）────────────────────────────
function makeFilter({btnId, panelId, label, keyOf, labelOf, sortByCount}){
  const sel = new Set();
  const btn = () => document.getElementById(btnId);
  const panel = () => document.getElementById(panelId);

  function build(){
    const counts = {};
    DATA.forEach(d=>{ const k=keyOf(d); if(k) counts[k]=(counts[k]||0)+1; });
    let keys = Object.keys(counts);
    keys.sort(sortByCount ? (a,b)=>counts[b]-counts[a]||a.localeCompare(b)
                          : (a,b)=>FILES.indexOf(a)-FILES.indexOf(b));   // 來源維持原本的排列順序
    panel().innerHTML =
      `<button type="button" class="c clr" data-clear="1">✕ 清除</button>` +
      keys.map(k=>`<button type="button" class="c" data-k="${esc(k)}" aria-pressed="false">${esc(labelOf(k))}<span class="n">${counts[k]}</span></button>`).join("");
    panel().addEventListener("click", e=>{
      const el = e.target.closest(".c");
      if(!el) return;
      if(el.dataset.clear) sel.clear();
      else{ const k=el.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); }
      sync(); renderActive(); render();
    });
    btn().addEventListener("click", e=>{
      e.stopPropagation();
      const willOpen = panel().hidden;
      closeAllPanels();                    // 一次只開一個
      panel().hidden = !willOpen;
      btn().setAttribute("aria-expanded", String(willOpen));
    });
    panel().addEventListener("click", e=>e.stopPropagation());
  }
  function sync(){
    panel().querySelectorAll(".c[data-k]").forEach(el=>{
      const on=sel.has(el.dataset.k); el.classList.toggle("on",on); el.setAttribute("aria-pressed",String(on));
    });
    btn().textContent = sel.size ? `${label} (${sel.size}) ▾` : `${label} ▾`;
    btn().classList.toggle("active", sel.size>0);
  }
  return {build, sync, sel, label, labelOf, panelId};
}

function closeAllPanels(){
  document.querySelectorAll(".catpanel").forEach(p=>p.hidden=true);
  ["catBtn","srcBtn","kindBtn"].forEach(id=>document.getElementById(id)?.setAttribute("aria-expanded","false"));
}

// 已選條件顯示成可個別移除的標籤，收起面板也看得到目前篩選了什麼
function renderActive(){
  const box=document.getElementById("activeFilters");
  const items=[];
  [catFilter, srcFilter, kindFilter].forEach(f=>{
    f.sel.forEach(k=>items.push({f,k,text:f.labelOf(k)}));
  });
  if(!items.length){ box.innerHTML=""; return; }
  box.innerHTML = items.map((it,i)=>
      `<button type="button" class="a" data-i="${i}">${esc(it.text)}<span class="x">✕</span></button>`).join("")
    + `<button type="button" class="allclr" data-all="1">全部清除</button>`;
  box.querySelectorAll("[data-i]").forEach(el=>{
    el.onclick=()=>{ const it=items[+el.dataset.i]; it.f.sel.delete(it.k); it.f.sync(); renderActive(); render(); };
  });
  const all=box.querySelector("[data-all]");
  if(all) all.onclick=()=>{ catFilter.sel.clear(); srcFilter.sel.clear(); kindFilter.sel.clear();
    catFilter.sync(); srcFilter.sync(); kindFilter.sync(); renderActive(); render(); };
}

const catFilter = makeFilter({btnId:"catBtn", panelId:"catPanel", label:"分類",
  keyOf:d=>d.cat, labelOf:k=>CAT_LABEL[k]?`${CAT_LABEL[k]} · ${k}`:k, sortByCount:true});
const srcFilter = makeFilter({btnId:"srcBtn", panelId:"srcPanel", label:"來源",
  keyOf:d=>d._src, labelOf:k=>SRC_LABEL[k]||k, sortByCount:false});
const kindFilter = makeFilter({btnId:"kindBtn", panelId:"kindPanel", label:"型態",
  keyOf:d=>d.kind, labelOf:k=>KIND_LABEL[k]||k, sortByCount:true});
const selCats = catFilter.sel, selSrcs = srcFilter.sel, selKinds = kindFilter.sel;

function restoreState(){
  const params=new URLSearchParams(location.search);
  document.getElementById("q").value=params.get("q")||"";
  [["cat",selCats],["src",selSrcs],["kind",selKinds]].forEach(([key,set])=>{
    (params.get(key)||"").split(",").filter(Boolean).forEach(value=>set.add(value));
  });
  const sort=params.get("sort");
  if(["popular","relevance","name","category","source"].includes(sort)) document.getElementById("sort").value=sort;
  favoritesOnly=params.get("fav")==="1";
  syncFavoriteButton();
  catFilter.sync();srcFilter.sync();kindFilter.sync();renderActive();
}
function syncState(){
  const url=new URL(location.href);
  const setParam=(key,value)=>value?url.searchParams.set(key,value):url.searchParams.delete(key);
  setParam("q",document.getElementById("q").value.trim());
  setParam("cat",[...selCats].join(","));setParam("src",[...selSrcs].join(","));setParam("kind",[...selKinds].join(","));
  const sort=document.getElementById("sort").value;
  setParam("sort",sort==="popular"?"":sort);
  setParam("fav",favoritesOnly?"1":"");
  history.replaceState(null,"",url);
}

function hay(d){
  let s=[d.name,d.kind,KIND_LABEL[d.kind],d.cat,d.desc,d.look,d.suite,d.vendor,(d.tags||[]).join(" "),(d.stack||[]).join(" ")];
  if(d.variants){s.push(Object.keys(d.variants).join(" "));s.push(Object.values(d.variants).join(" "));}
  return s.join(" ").toLowerCase();
}
function parseTerms(raw){
  const terms=[];
  const pattern=/"([^"]+)"|'([^']+)'|(\S+)/g;
  let match;
  while((match=pattern.exec(raw))) terms.push((match[1]||match[2]||match[3]).toLowerCase());
  return [...new Set(terms)];
}
function score(d,terms,phrase=""){
  const name=(d.name||"").toLowerCase(), tags=(d.tags||[]).join(" ").toLowerCase(), text=hay(d);
  let sc=0;
  for(const t of terms){if(!t)continue;
    if(name.includes(t))sc+=5; if(tags.includes(t))sc+=3; if(text.includes(t))sc+=1;}
  if(phrase){if(name===phrase)sc+=40;else if(name.includes(phrase))sc+=20;if(tags.includes(phrase))sc+=10;}
  return sc;
}
// 這是人工精選與資料來源順序組成的策展排序，不是下載量或使用者追蹤數據。
// key 加上來源，避免 Glow 之類的同名效果互相覆蓋。
const POPULAR_KEYS = [
  "aescripts:Deep Glow 2", "third-party:Element 3D", "red-giant:Particular",
  "third-party:Optical Flares", "third-party:Saber", "third-party:FX Console",
  "third-party:Twixtor", "aescripts:Plexus 3", "third-party:Mocha Pro",
  "third-party:Neat Video", "aescripts:Lockdown", "aescripts:AutoFill",
  "red-giant:Looks", "sapphire:S_Glow", "continuum:BCC Particle Illusion",
  "third-party:ReelSmart Motion Blur", "third-party:Duik Ángela",
  "universe:Glow", "builtin-ae:Glow", "aescripts:Shadow Studio 3",
  "aescripts:Composite Brush", "red-giant:Form", "sapphire:S_LensFlare",
  "continuum:BCC Title Studio", "builtin-ae:Fractal Noise"
];
POPULAR_KEYS.push(
  "aescripts:KBar3", "aescripts:Flow",
  "aescripts:Pixel Sorter 4", "aescripts:Newton 4", "aescripts:Joysticks 'n Sliders",
  "builtin-ae:Camera Lens Blur", "builtin-ae:Turbulent Displace", "builtin-ae:Warp Stabilizer",
  "builtin-ae:Keylight (1.2)", "builtin-ae:Lumetri Color", "builtin-ae:Curves",
  "red-giant:Supercomp", "sapphire:S_Effect",
  "continuum:BCC+ Beauty Studio", "continuum:BCC+ Primatte Studio", "universe:VHS",
  "aescripts:Beauty Box Video", "third-party:RE:Vision DEFlicker", "third-party:RE:Match"
);
const POPULAR_INDEX = new Map(POPULAR_KEYS.map((k,i)=>[k,i]));
const POPULAR_SRC = ["aescripts","third-party","red-giant","sapphire","universe","continuum","builtin-ae","recipes","installed"];
const SOURCE_WEIGHT = {"third-party":80,"aescripts":75,"red-giant":70,"sapphire":65,"continuum":60,"universe":55,"builtin-ae":45,"recipes":25,"installed":5};
function popularityScore(d){
  const featured=POPULAR_INDEX.get(`${d._src}:${d.name}`);
  const featuredScore=featured===undefined ? 0 : 100000-featured*100;
  const quality=(d.url?20:0)+(d.look?8:0)+(d.desc?5:0)-(d.unverified?1000:0);
  const curatedOrder=Math.max(0,300-Math.min(d._rank??300,300));
  return featuredScore+(SOURCE_WEIGHT[d._src]||0)*100+quality+curatedOrder;
}
function popularCmp(a,b){
  return popularityScore(b)-popularityScore(a)
    || POPULAR_SRC.indexOf(a._src)-POPULAR_SRC.indexOf(b._src)
    || (a._rank??9999)-(b._rank??9999)
    || (a.name||"").localeCompare(b.name||"");
}
function sourceCmp(a,b){
  return POPULAR_SRC.indexOf(a._src)-POPULAR_SRC.indexOf(b._src)
    || (a._rank??9999)-(b._rank??9999)
    || (a.name||"").localeCompare(b.name||"");
}
function categoryCmp(a,b){
  return (CAT_LABEL[a.cat]||a.cat||"").localeCompare(CAT_LABEL[b.cat]||b.cat||"", "zh-Hant")
    || (a.name||"").localeCompare(b.name||"");
}
function resultCmp(a,b,hasTerms){
  const mode=document.getElementById("sort").value;
  if(mode==="name") return (a[1].name||"").localeCompare(b[1].name||"");
  if(mode==="category") return categoryCmp(a[1],b[1]);
  if(mode==="source") return sourceCmp(a[1],b[1]);
  if(mode==="relevance" && hasTerms) return b[0]-a[0]||popularCmp(a[1],b[1]);
  return popularCmp(a[1],b[1]);
}
function sortedResults(pool,terms,{requireAll=true,phrase=""}={}){
  const hasTerms=terms.length>0;
  return pool.map(d=>[hasTerms?score(d,terms,phrase):0,d])
    .filter(x=>!hasTerms||(requireAll?terms.every(t=>hay(x[1]).includes(t)):x[0]>0))
    .sort((a,b)=>resultCmp(a,b,hasTerms)).map(x=>x[1]);
}
function hl(txt,terms){
  let s=esc(txt);
  for(const t of terms){if(t.length<1)continue;
    try{s=s.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}catch(e){}}
  return s;
}

// 中文長詞拆成 2 字詞組（「煙霧模擬」→ 煙霧/霧模/模擬），只在完全搜不到時當備援
const CJK=/[一-鿿㐀-䶿]/;
const CJK2=/^[一-鿿㐀-䶿]{2}$/;   // 兩個字都要是中文，避免產生「z不」這種混雜詞
function segment(terms){
  const out=[];
  for(const t of terms){
    if(t.length>=3 && CJK.test(t)){
      for(let i=0;i<t.length-1;i++){
        const g=t.slice(i,i+2);
        if(CJK2.test(g)) out.push(g);
      }
    }
  }
  return [...new Set(out)];
}

function render(preserveLimit=false){
  if(!preserveLimit) visibleLimit=60;
  const raw=document.getElementById("q").value.trim().toLowerCase();
  const terms=parseTerms(raw);
  const phrase=terms.join(" ");
  let pool=DATA;
  if(selCats.size)pool=pool.filter(d=>selCats.has(d.cat));
  if(selSrcs.size)pool=pool.filter(d=>selSrcs.has(d._src));
  if(selKinds.size)pool=pool.filter(d=>selKinds.has(d.kind));
  if(favoritesOnly)pool=pool.filter(d=>FAVORITES.has(itemKey(d)));
  let list, searchNote="", highlightTerms=[...terms];
  if(terms.length){
    list=sortedResults(pool,terms,{requireAll:true,phrase});
    if(!list.length){
      if(terms.length>1){
        list=sortedResults(pool,terms,{requireAll:false,phrase});
        if(list.length) searchNote=`沒有同時符合全部關鍵字，改顯示符合任一關鍵字`;
      }
      if(!list.length){
        const segs=segment(terms);
        if(segs.length){
          list=sortedResults(pool,segs,{requireAll:false});
          if(list.length){searchNote=`找不到「${esc(raw)}」，已自動拆詞：${segs.map(esc).join("、")}`;highlightTerms.push(...segs);}
        }
      }
    }
  }else{
    list=sortedResults(pool,[]);
  }
  const kindCounts=list.reduce((counts,d)=>{counts[d.kind]=(counts[d.kind]||0)+1;return counts;},{});
  const summary=Object.entries(kindCounts).map(([kind,n])=>`<i>${esc(KIND_LABEL[kind]||kind)} ${n}</i>`).join("");
  const sortMode=document.getElementById("sort").value;
  const sortNotes={
    popular:"精選熱門依人工精選、來源權重與策展順序排列，不是下載量",
    relevance:raw?"搜尋相關度依名稱、標籤與說明命中程度排列":"沒有搜尋詞時，相關度改用精選熱門",
    name:"依效果名稱排列",
    category:"依功能分類，再依名稱排列",
    source:"依來源與原廠清單順序排列"
  };
  const sortNote=` <span title="${esc(sortNotes[sortMode])}">· ${esc(sortNotes[sortMode])} ⓘ</span>`;
  document.getElementById("count").innerHTML =
    ((raw||selCats.size||selSrcs.size||selKinds.size||favoritesOnly)? `${list.length} 筆結果`:`瀏覽全部 ${list.length} 筆`) +
    (searchNote?` <span>· ${searchNote}</span>`:sortNote) + `<span class="summary">${summary}</span>`;
  syncState();
  document.getElementById("clearQ").hidden=!raw;
  const box=document.getElementById("results");
  if(!list.length){
    const hasFilter = selCats.size || selSrcs.size || selKinds.size || favoritesOnly;
    box.innerHTML = '<div class="empty">' + (hasFilter
      ? '這組篩選沒有結果，試著<b class="lnk" id="emptyClear">清除篩選</b>或改選其他分類／來源'
      : '找不到，換個說法試試（例：發光 / glow / 光暈 / 輝光）') + '</div>';
    const ec = document.getElementById("emptyClear");
    if(ec) ec.onclick = ()=>{ catFilter.sel.clear(); srcFilter.sel.clear(); kindFilter.sel.clear();favoritesOnly=false;
      syncFavoriteButton();
      catFilter.sync(); srcFilter.sync(); kindFilter.sync(); renderActive(); render(); };
    return;
  }
  box.innerHTML=list.slice(0,visibleLimit).map(d=>{
    const origin=d.suite||d.vendor||SRC_LABEL[d._src]||d._src;
    let stack="";
    if(d.stack) stack='<ul class="stack">'+d.stack.map(s=>"<li>▸ "+hl(s,highlightTerms)+"</li>").join("")+
      (d.builtin?'<li style="color:var(--accent)">內建替代：'+hl(d.builtin,highlightTerms)+'</li>':"")+"</ul>";
    let vars="";
    if(d.variants) vars='<div class="variants">'+Object.entries(d.variants).map(([k,v])=>
      "<span>"+esc(k)+" · "+esc(v)+"</span>").join("")+"</div>";
    let tags=(d.tags||[]).slice(0,12).map(t=>`<button type="button" data-q="${esc(t)}">${esc(t)}</button>`).join("");
    const warn = d.unverified ? '<span class="warn">⚠ 未驗證</span>' : '';
    const nameHtml = d.url
      ? `<a class="name namelink" href="${esc(d.url)}" target="_blank" rel="noopener" title="開啟官方頁">${hl(d.name,highlightTerms)}<span class="ext">↗</span></a>`
      : `<span class="name">${hl(d.name,highlightTerms)}</span>`;
    const kind=d.kind||"plugin";
    const catLabel=CAT_LABEL[d.cat] ? `${CAT_LABEL[d.cat]} · ${d.cat}` : (d.cat||"");
    const favorite=FAVORITES.has(itemKey(d));
    return `<div class="card kind-${kind}"><div class="top">
        ${nameHtml}
        <span class="kindbadge kind-${kind}">${esc(KIND_LABEL[kind]||kind)}</span>
        <span class="catbadge">${esc(catLabel)}</span>${warn}
        <button class="favbtn${favorite?" on":""}" type="button" data-favorite="${esc(itemKey(d))}" aria-pressed="${favorite}" title="${favorite?"取消收藏":"加入收藏"}" aria-label="${favorite?"取消收藏":"收藏"} ${esc(d.name)}">${favorite?"★":"☆"}</button>
        <span class="src">${esc(origin)}</span></div>
      <div class="desc">${hl(d.desc||"",highlightTerms)}</div>
      ${stack}${vars}<div class="tags">${tags}</div></div>`;
  }).join("") + (list.length>visibleLimit
    ? `<button id="loadMore" class="more" type="button">顯示更多（尚有 ${list.length-visibleLimit} 筆）</button>`:"");
  document.getElementById("loadMore")?.addEventListener("click",()=>{visibleLimit+=60;render(true);});
}

// 一鍵複製 AI 提示詞：貼進任何 AI 就能用「描述或貼圖」找特效
const AI_PROMPT = `你是我的 After Effects 特效顧問。請先讀取這份繁體中文特效資料庫：
https://raw.githubusercontent.com/xup61069/ae-effects-db/main/dist/index.txt

（格式：名稱｜來源｜型態｜分類｜說明｜官方連結。需要中英搜尋標籤與外觀描述時，
再讀完整版 https://raw.githubusercontent.com/xup61069/ae-effects-db/main/dist/all.jsonl）

之後我會用文字描述想要的畫面，或直接貼參考圖。請你：
1. 先判斷我要的視覺特徵（發光？故障？老膠片？粒子？扭曲？轉場？調色？）。
   一張參考圖通常是「多個效果疊加」，請拆開來分析。
2. 從資料庫挑出最合適的 3~5 個，每個說明：名稱（來源）、為什麼適合、關鍵參數往哪調。
3. 一定要附上資料庫裡的官方連結。
4. 最後補一行「沒有外掛時，用 AE 內建怎麼做」（資料庫裡來源標「AE內建」的那些）。
5. 全程用繁體中文回答。若資料庫裡真的沒有，明說沒有，不要編造不存在的外掛。

讀好了就回覆「準備好了」，然後等我描述或貼圖。`;

const AI_OK = '✅ 已複製！貼進 ChatGPT / Claude / Gemini，等它說「準備好了」，就可以描述效果或<b>直接貼參考圖</b>。 '
  + '<a href="https://github.com/xup61069/ae-effects-db/blob/main/PROMPT.md" target="_blank" rel="noopener">更多用法</a>';

function showPromptBox(msg){
  // 瀏覽器擋剪貼簿時的備援：直接給一個已全選的文字框，按 Ctrl+C 就好
  msg.innerHTML = '請按 <b>Ctrl+C</b>（Mac 是 ⌘+C）複製下面這段，再貼進你的 AI：';
  const ta = document.createElement("textarea");
  ta.value = AI_PROMPT;
  ta.rows = 6;
  ta.style.cssText = "width:100%;margin-top:8px;padding:10px;border-radius:10px;font-size:12px;"
    + "border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit";
  msg.appendChild(ta);
  ta.focus(); ta.select();
}

document.getElementById("aiBtn").addEventListener("click", async ()=>{
  const msg = document.getElementById("aiMsg");
  msg.innerHTML = "";
  let copied = false;
  try{
    await navigator.clipboard.writeText(AI_PROMPT);
    copied = true;
  }catch(e){ copied = false; }
  if(copied){
    msg.innerHTML = AI_OK;
    setTimeout(()=>{ if(!msg.querySelector("textarea")) msg.textContent=""; }, 12000);
  }else{
    showPromptBox(msg);
  }
});

document.getElementById("q").addEventListener("input",()=>render());
document.getElementById("clearQ").addEventListener("click",()=>{
  const input=document.getElementById("q");input.value="";input.focus();render();
});
document.getElementById("sort").addEventListener("change",()=>render());
document.getElementById("favBtn").addEventListener("click",()=>{
  favoritesOnly=!favoritesOnly;syncFavoriteButton();render();
});
// 點面板以外的地方、或按 Esc，就收起篩選面板
document.addEventListener("click", closeAllPanels);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeAllPanels(); });
document.addEventListener("click",e=>{
  const favorite=e.target.closest&&e.target.closest("[data-favorite]");
  if(favorite){
    const key=favorite.dataset.favorite;
    FAVORITES.has(key)?FAVORITES.delete(key):FAVORITES.add(key);
    saveFavorites();render(true);return;
  }
  const q=e.target.getAttribute&&e.target.getAttribute("data-q");
  if(q){document.getElementById("q").value=q;render();window.scrollTo({top:0,behavior:"smooth"});}
});
boot();
