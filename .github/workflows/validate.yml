name: validate

on:
  push:
    paths: ["data/**", "index.html", "tests/**", "validate.py", "search.py", "tools/**", "schema/**"]
  pull_request:
    paths: ["data/**", "index.html", "tests/**", "validate.py", "search.py", "tools/**", "schema/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/*.jsonl
        run: python validate.py --strict
      - name: Audit curated keys and duplicate products
        run: python tools/audit.py --strict
      - name: Run search and consistency tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m py_compile validate.py search.py tools/add.py tools/audit.py tools/build_index.py tools/classify_kind.py tests/test_consistency.py tests/test_web_ui.py
