name: validate

on:
  push:
    paths: ["*.md", "llms.txt", ".github/**", "data/**", "dist/**", "curation/**", "skill/**", "index.html", "i18n.js", "tests/**", "validate.py", "search.py", "tools/**", "schema/**"]
  pull_request:
    paths: ["*.md", "llms.txt", ".github/**", "data/**", "dist/**", "curation/**", "skill/**", "index.html", "i18n.js", "tests/**", "validate.py", "search.py", "tools/**", "schema/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/*.jsonl
        run: python validate.py --strict
      - name: Audit curated keys and duplicate products
        run: python tools/audit.py --strict
      - name: Run search and consistency tests
        run: python -m unittest discover -s tests -v
      - name: Validate web JavaScript and locales
        run: node --check tools/build_localization.js && node tests/check_web_js.js
      - name: Verify generated indexes are current
        run: python tools/build_index.py && git diff --exit-code -- dist/
      - name: Compile Python tools
        run: python -m py_compile validate.py search.py tools/add.py tools/audit.py tools/build_index.py tools/classify_kind.py tests/test_consistency.py tests/test_docs.py tests/test_localization.py tests/test_web_ui.py
