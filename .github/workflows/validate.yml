name: validate

on:
  push:
    paths: ["data/**", "validate.py", "schema/**"]
  pull_request:
    paths: ["data/**", "validate.py", "schema/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/*.jsonl
        run: python validate.py
