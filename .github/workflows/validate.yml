name: validate

on:
  push:
    paths: ["data/**", "validate.py", "search.py", "tools/add.py", "tools/audit.py", "schema/**"]
  pull_request:
    paths: ["data/**", "validate.py", "search.py", "tools/add.py", "tools/audit.py", "schema/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/*.jsonl
        run: python validate.py --strict
      - name: Compile Python tools
        run: python -m py_compile validate.py search.py tools/add.py tools/audit.py
