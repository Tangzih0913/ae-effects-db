name: 補充特效 / 回報問題
description: 想到什麼就寫什麼，格式不拘，我們會整理進資料庫
title: "補充："
labels: ["add-effect"]
body:
  - type: markdown
    attributes:
      value: |
        隨便寫沒關係 👌 貼個外掛名稱、官網連結，或只說「我想找XX效果但搜不到」都可以。
        剩下的整理工作交給我們（和 AI）就好。
  - type: textarea
    id: body
    attributes:
      label: 內容
      placeholder: |
        例如：
        · Deep Glow 這個外掛沒收錄
        · https://aescripts.com/xxxx/
        · 想找「文字爆炸成粒子」但搜不到
        · 某某條目的說明怪怪的
